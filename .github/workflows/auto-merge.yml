name: Auto Merge

# Any non-draft PR targeting `dev` or `main` is merged automatically once ALL
# of these are true:
#   - every check run on the PR head is green (or skipped/neutral)
#   - the PR has at least as many approvals as the base branch requires
#     (read from the branch's ruleset / branch protection), and no
#     CHANGES_REQUESTED
#   - no unresolved review threads
#   - the PR is mergeable (branch auto-updated when behind; conflicts surfaced)
#
# The required approval count is NOT hardcoded: it is read from the base
# branch's ruleset (or legacy branch protection), so it always matches the
# repo's own configuration.
#
# Merge method is derived from the base branch:
#   - dev  -> squash
#   - main -> merge commit
#
# Comment commands on a PR:
#   - /merge        re-check and merge if all gates pass (admin/maintainer)
#   - /merge-force  merge immediately, ignoring all gates (admin only)
#
# The workflow posts an intro summary comment on each managed PR.
#
# Triggers (re-evaluate on any relevant state change):
#   - pull_request: synchronize / ready_for_review / reopened
#   - pull_request_review: submitted        (approval also kicks off the merge)
#   - check_run: completed                  (re-evaluates as checks finish)
#   - issue_comment: /merge* comment        (manual re-trigger)
#   - workflow_dispatch: PR number input    (manual re-trigger from Actions tab)

on:
  pull_request:
    types: [synchronize, ready_for_review, reopened]
  pull_request_review:
    types: [submitted]
  check_run:
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  # Per-PR group so different PRs evaluate in parallel; stale evaluations for
  # the same PR are cancelled by newer ones.
  group: auto-merge-${{ github.event.pull_request.number || github.event.check_run.check_suite.pull_requests[0].number || github.event.issue.number || inputs.pr_number || 'adhoc' }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: |
      github.event_name != 'issue_comment' ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/merge') || startsWith(github.event.comment.body, '/automerge')))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number(s) to evaluate
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_INPUT: ${{ inputs.pr_number }}
        run: |
          set +e -uo pipefail
          nums=""
          force=0
          case "$EVENT" in
            pull_request|pull_request_review)
              nums=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
              ;;
            check_run)
              # Skip our own check runs to avoid a self-trigger loop.
              name=$(jq -r '.check_run.name // ""' "$GITHUB_EVENT_PATH")
              case "$name" in
                auto-merge|Auto\ Merge|*"Auto Merge"*) echo "Self-trigger ($name); skip." ;;
                *) nums=$(jq -r '.check_run.check_suite.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH") ;;
              esac
              ;;
            issue_comment)
              # Only comments on PRs (not issues).
              is_pr=$(jq -r '.issue.pull_request != null' "$GITHUB_EVENT_PATH")
              if [ "$is_pr" != "true" ]; then
                echo "Comment not on a PR; skip."
                echo "nums=" >> "$GITHUB_OUTPUT"
                echo "force=0" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              cmd=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH" | awk '{print $1}')
              commenter=$(jq -r '.comment.user.login' "$GITHUB_EVENT_PATH")
              perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$commenter/permission" --jq .permission 2>/dev/null || echo none)
              case "$cmd" in
                /merge-force|/force-merge)
                  case "$perm" in
                    admin) echo "Admin force-merge requested by $commenter."; nums=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH"); force=1 ;;
                    *) echo "Only admins can force-merge. $commenter is $perm; skip." ;;
                  esac
                  ;;
                /merge|/automerge|/remerge)
                  case "$perm" in
                    admin|maintain) nums=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH") ;;
                    *) echo "Commenter $commenter ($perm) not authorised to /merge; skip." ;;
                  esac
                  ;;
                *) echo "Not a recognised merge command ($cmd); skip." ;;
              esac
              ;;
            workflow_dispatch)
              nums="$PR_INPUT"
              [[ "$nums" =~ ^[0-9]+$ ]] || { echo "Invalid pr_number input '$nums'."; nums=""; }
              ;;
          esac
          echo "Resolved PRs: ${nums:-<none>} (force=$force)"
          echo "nums=$nums" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMS: ${{ steps.pr.outputs.nums }}
          FORCE: ${{ steps.pr.outputs.force }}
          # Optional admin token for /merge-force to bypass branch protection.
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set +e -uo pipefail

          owner=${GITHUB_REPOSITORY%%/*}
          name=${GITHUB_REPOSITORY#*/}

          # Post a PR comment only if one with the same marker doesn't already exist.
          post_once() {
            local pr="$1" marker="$2" body="$3"
            if gh pr view "$pr" --json comments --jq '.comments[].body' 2>/dev/null \
               | grep -q "<!-- auto-merge:$marker -->"; then
              return 0
            fi
            gh pr comment "$pr" --body "<!-- auto-merge:$marker -->
          $body" 2>/dev/null || true
          }

          # Required approving reviews for a branch, read from the repo config:
          # rulesets (max across them) with a legacy branch-protection fallback.
          min_approvals() {
            local branch="$1" r b
            r=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$branch" \
                --jq '[.[] | select(.type=="pull_request") | (.parameters.required_approving_review_count // 0)] | (if length>0 then max else 0 end)' 2>/dev/null)
            case "$r" in ''|*[!0-9]*) r="" ;; esac
            b=$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch/protection" \
                --jq '.required_pull_request_reviews.required_approving_review_count // 0' 2>/dev/null)
            case "$b" in ''|*[!0-9]*) b="" ;; esac
            if [ -z "$r" ] && [ -z "$b" ]; then
              # Protection config unreadable (403/rate-limit/etc): fail closed
              # by demanding an unreachable number of approvals.
              echo 999999
              return 0
            fi
            r=${r:-0}
            b=${b:-0}
            if [ "$r" -ge "$b" ]; then echo "$r"; else echo "$b"; fi
          }

          evaluate() {
            local pr="$1" force="${2:-0}"
            echo "::group::PR #$pr"
            local base head headref state isdraft method minappr
            base=$(gh pr view "$pr" --json baseRefName --jq .baseRefName)
            case "$base" in
              dev)  method=squash ;;
              main) method=merge ;;
              *)    echo "Base '$base' not managed by auto-merge; skip."; echo "::endgroup::"; return 0 ;;
            esac

            state=$(gh pr view "$pr" --json state,isDraft --jq '[.state,.isDraft]|@tsv')
            read -r state isdraft <<< "$state"
            [ "$state" = "OPEN" ] || { echo "PR is $state; skip."; echo "::endgroup::"; return 0; }
            [ "$isdraft" = "false" ] || { echo "Draft; skip."; echo "::endgroup::"; return 0; }

            head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
            headref=$(gh pr view "$pr" --json headRefName --jq .headRefName)
            minappr=$(min_approvals "$base")

            # Post an intro summary once per managed PR.
            post_once "$pr" "intro" "🤖 **Auto Merge** is active (base: \`$base\`, method: \`$method\`).

          It will merge automatically once:
          - all checks are green
          - at least **$minappr** approval(s)
          - no unresolved review threads

          Comments: \`/merge\` to re-check & merge (admin/maintainer), \`/merge-force\` to merge ignoring all gates (admin only)."

            # Admin force-merge: bypass all gates.
            if [ "$force" = "1" ]; then
              local del=""
              case "$headref" in dev|main) ;; *) del="--delete-branch" ;; esac
              echo "Admin force-merge requested; ignoring all gates."
              local rc=0 out
              if [ -n "$ADMIN_TOKEN" ]; then
                out=$(GH_TOKEN="$ADMIN_TOKEN" gh pr merge "$pr" --"$method" $del --admin 2>&1) || rc=$?
              else
                out=$(gh pr merge "$pr" --"$method" $del --admin 2>&1) || rc=$?
              fi
              if [ "$rc" -eq 0 ]; then
                echo "✅ Force-merged PR #$pr ($method)."
              else
                echo "❌ Admin force-merge failed. Resolve the issue and comment /merge-force to retry."
                post_once "$pr" "merge-failed" "❌ Admin force-merge failed. Resolve the issue and comment \`/merge-force\` to retry."
              fi
              echo "::endgroup::"; return 0
            fi

            # Mergeability: handle conflicts / behind / unknown before gating.
            local mss
            mss=$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)
            case "$mss" in
              DIRTY)
                echo "Conflicts; needs manual resolution."
                post_once "$pr" "conflict" "⚠️ Auto-merge is blocked: this PR has merge conflicts. Resolve them and push, or comment \`/merge\`."
                echo "::endgroup::"; return 0
                ;;
              BEHIND)
                echo "Head is behind base; updating branch."
                if gh pr update-branch "$pr" --merge 2>/dev/null; then
                  echo "Branch updated; synchronize will re-trigger."
                else
                  post_once "$pr" "behind" "⚠️ Auto-merge could not update this branch (behind base). Update it manually, then comment \`/merge\`."
                fi
                echo "::endgroup::"; return 0
                ;;
              UNKNOWN)
                echo "Merge state unknown (GitHub computing); will retry on next event."
                echo "::endgroup::"; return 0
                ;;
            esac

            # Gate 1: every check run on the head SHA must be green/skipped/neutral.
            local pending=0 failed=0
            while IFS=$'\t' read -r cname cstatus cconcl; do
              [ -n "$cname" ] || continue
              case "$cstatus" in
                completed)
                  case "$cconcl" in
                    success|skipped|neutral) echo "  ok   $cname" ;;
                    *) echo "  fail $cname ($cconcl)"; failed=1 ;;
                  esac
                  ;;
                *) echo "  wait $cname ($cstatus)"; pending=1 ;;
              esac
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$head/check-runs" \
                        --arg runid "$GITHUB_RUN_ID" \
                        --jq '.check_runs[] | select((.html_url | contains("/" + $runid + "/")) | not) | [.name,.status,(.conclusion // "")] | @tsv' 2>/dev/null || true)
            [ "$pending" -eq 0 ] || { echo "Checks pending; will retry on next check_run."; echo "::endgroup::"; return 0; }
            [ "$failed" -eq 0 ] || { echo "Checks failing; not merging."; echo "::endgroup::"; return 0; }

            # Gate 2: approvals >= what the base branch requires, 0 changes requested.
            local approved=0 changes=0
            while read -r s; do
              case "$s" in
                APPROVED) approved=$((approved+1)) ;;
                CHANGES_REQUESTED) changes=$((changes+1)) ;;
              esac
            done < <(gh pr view "$pr" --json reviews --jq '.reviews[].state' 2>/dev/null || true)
            [ "$changes" -eq 0 ] || { echo "Changes requested; not merging."; echo "::endgroup::"; return 0; }
            [ "$approved" -ge "$minappr" ] || { echo "Only $approved approval(s); need $minappr; not merging."; echo "::endgroup::"; return 0; }

            # Gate 3: no unresolved review threads (GraphQL; REST has no threads endpoint).
            local unresolved=0 cursor=""
            while :; do
              local out count has_more end
              out=$(gh api graphql -f query="query{repository(owner:\"$owner\",name:\"$name\"){pullRequest(number:$pr){reviewThreads(first:100${cursor:+ ,after:\"$cursor\"}){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}" \
                   --jq '.data.repository.pullRequest.reviewThreads // empty' 2>/dev/null) || {
                echo "Could not read review threads (API error); not merging."
                echo "::endgroup::"; return 0
              }
              [ -n "$out" ] || break
              count=$(jq -r '[.nodes[] | select(.isResolved == false)] | length' <<< "$out")
              unresolved=$((unresolved + count))
              has_more=$(jq -r '.pageInfo.hasNextPage // "false"' <<< "$out")
              end=$(jq -r '.pageInfo.endCursor // ""' <<< "$out")
              [ "$has_more" = "true" ] && [ -n "$end" ] || break
              cursor="$end"
            done
            [ "$unresolved" -eq 0 ] || { echo "$unresolved unresolved thread(s); not merging."; echo "::endgroup::"; return 0; }

            # All gates passed: merge.
            echo "All gates passed; merging with method '$method'."
            local del=""
            case "$headref" in dev|main) ;; *) del="--delete-branch" ;; esac
            local err
            if err=$(gh pr merge "$pr" --"$method" $del 2>&1); then
              echo "✅ Merged PR #$pr ($method)."
            else
              echo "❌ Auto-merge could not merge this PR. Resolve the issue and comment /merge to retry."
              post_once "$pr" "merge-failed" "❌ Auto-merge could not merge this PR. Resolve the issue and comment \`/merge\` to retry."
            fi
            echo "::endgroup::"
          }

          [ -n "$NUMS" ] || { echo "No PRs to evaluate."; exit 0; }
          for n in $NUMS; do
            evaluate "$n" "$FORCE" || true
          done
