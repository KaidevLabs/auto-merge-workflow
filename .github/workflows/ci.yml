name: Simulated CI

# Toy CI that always passes, so the Auto Merge workflow has a check run it
# must wait for before merging. Simulates a real test suite.

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  simulated-tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulated test steps
        run: |
          echo "Running simulated test suite (toy)..."
          sleep 2
          test -f README.md && echo "ok: README.md present"
          echo "All simulated tests passed."

  test-summary:
    if: ${{ !github.event.pull_request.draft }}
    needs: simulated-tests
    runs-on: ubuntu-latest
    steps:
      - name: Fail if tests failed
        if: needs.simulated-tests.result != 'success'
        run: exit 1
      - name: Passed
        if: needs.simulated-tests.result == 'success'
        run: echo "✅ Simulated CI passed."
